name: Update GitHub Stats Gist
on:
    workflow_dispatch:
    schedule:
        - cron: '0 */12 * * *'
    push:
        branches: master
jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-node@master
              with:
                  node-version: 16
            # Edited index.js locally (see git history), so run our own copy instead of
            # the published package. N.B: this fork will not receive upstream updates.
            - uses: actions/checkout@master
            - run: npm ci
            - run: npm start
              env:
                  GH_TOKEN: ${{ secrets.GH_TOKEN }} # Do not edit, defined in secrets

                  # Edit the following environment variables
                  GIST_ID: dbb613c37b4d718b7bf5f976f0eadde6 # The ID portion from your gist url
                  ALL_COMMITS: true # If `true` it will count all commits, if `false` it will count your last year commits
                  K_FORMAT: false # If `true`, large numbers will be formatted with a "k", for example "1.5k"
